[project]
name = "caft"
version = "0.1.0"
description = "Code for this paper: https://arxiv.org/abs/2507.16795"
readme = "README.md"
authors = [
    { name = "hcasademunt", email = "helena.casademunt@gmail.com" },
    { name = "cadentj", email = "caden.juang@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "datasets==2.21.0",
    "ipykernel>=6.29.5",
    "matplotlib>=3.10.0",
    "nbformat>=5.10.4",
    "nnsight==0.4.0",
    "transformers==4.56.2",
    "sentence-transformers>=3.4.1",
    "simple-parsing>=0.1.6",
    "torchtyping>=0.1.5",
    "wandb>=0.19.5",
    "fire",
    "backoff",
    "setuptools",
    "unsloth==2025.4.7",
    "vllm==0.10.2"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["caft"]

